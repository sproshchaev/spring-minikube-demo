apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-minikube-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-minikube-demo
  template:
    metadata:
      labels:
        app: spring-minikube-demo
    spec:
      containers:
        - name: spring-minikube-demo
          image: spring-minikube-demo:v1
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: spring-minikube-demo-service
spec:
  selector:
    app: spring-minikube-demo
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: NodePort